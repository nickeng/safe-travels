<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safe Travels — Sample Guides</title>
<meta name="description" content="Browse sample travel guides created by Safe Travels — each one researched, written and designed from a single prompt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f2ece1;
  --paper:#faf6ee;
  --ink:#16130f;
  --muted:#7d7364;
  --line:#ddd2bd;
  --coral:#d9451f;
  --gold:#e8a02c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Newsreader',serif;line-height:1.5}
.frame{max-width:1120px;margin:0 auto;padding:0 1.25rem}
header{padding:3rem 0 1.4rem}
h1{font-family:'Staatliches',sans-serif;font-weight:400;font-size:clamp(3rem,8vw,5.3rem);line-height:.83;margin:0 0 .7rem;text-transform:uppercase;letter-spacing:.015em}
h1 .accent{color:var(--coral)}
header p.sub{margin:0;font-size:1.12rem;color:var(--muted)}
.map-wrap{padding:1.4rem 0 0}
#map{height:62vh;min-height:400px;border:2px solid var(--ink);border-radius:2px;box-shadow:6px 6px 0 rgba(22,19,15,.12);z-index:0}
main{padding:2rem 0 3.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.5rem 1.25rem}
.card{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:1.15rem 3.4rem 1.25rem 1.2rem;text-decoration:none;color:inherit;
  box-shadow:0 2px 6px rgba(22,19,15,.08);transition:transform .18s,box-shadow .18s;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 6px,rgba(217,69,31,.05) 6px,rgba(217,69,31,.05) 7px)}
@media(min-width:660px){.card{min-height:12rem}}
.grid .card:nth-child(7n+1){transform:rotate(-.7deg)}
.grid .card:nth-child(7n+2){transform:rotate(.5deg)}
.grid .card:nth-child(7n+3){transform:rotate(-.25deg)}
.grid .card:nth-child(7n+4){transform:rotate(.8deg)}
.grid .card:nth-child(7n+5){transform:rotate(-.5deg)}
.grid .card:nth-child(7n+6){transform:rotate(.3deg)}
.grid .card:nth-child(7n){transform:rotate(-.85deg)}
.card:hover,.card:focus-visible{transform:rotate(0) translateY(-4px);box-shadow:0 12px 26px rgba(22,19,15,.16);outline:none;z-index:2}
/* Postage stamp: four repeating radial-gradient masks, intersected, notch the edges into
   perforations. --r is the tooth radius, --s their spacing. */
.card .stamp{position:absolute;top:.7rem;right:.7rem;width:2.15rem;height:2.6rem;
  display:flex;align-items:center;justify-content:center;
  font-family:'Newsreader',serif;font-weight:600;font-size:.82rem;color:var(--paper);
  background:var(--coral);transform:rotate(4deg);--r:3.2px;--s:9px;
  -webkit-mask:
    radial-gradient(circle var(--r) at 50% 0,#0000 97%,#000) 50% 0/var(--s) 100% repeat-x,
    radial-gradient(circle var(--r) at 50% 100%,#0000 97%,#000) 50% 100%/var(--s) 100% repeat-x,
    radial-gradient(circle var(--r) at 0 50%,#0000 97%,#000) 0 50%/100% var(--s) repeat-y,
    radial-gradient(circle var(--r) at 100% 50%,#0000 97%,#000) 100% 50%/100% var(--s) repeat-y;
  mask:
    radial-gradient(circle var(--r) at 50% 0,#0000 97%,#000) 50% 0/var(--s) 100% repeat-x,
    radial-gradient(circle var(--r) at 50% 100%,#0000 97%,#000) 50% 100%/var(--s) 100% repeat-x,
    radial-gradient(circle var(--r) at 0 50%,#0000 97%,#000) 0 50%/100% var(--s) repeat-y,
    radial-gradient(circle var(--r) at 100% 50%,#0000 97%,#000) 100% 50%/100% var(--s) repeat-y;
  -webkit-mask-composite:source-in;mask-composite:intersect}
.card .stamp::before{content:'';position:absolute;inset:4px;border:1px solid rgba(250,246,238,.5);border-radius:1px}
.card h2{font-family:'Staatliches',sans-serif;font-weight:400;font-size:1.35rem;line-height:1.12;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.02em}
.card p.prompt{margin:auto 0;font-style:italic;color:var(--muted);font-size:.98rem}
.card p.prompt::before{content:"“"}
.card p.prompt::after{content:"”"}
.maplibregl-popup-content{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:2px;box-shadow:4px 4px 0 rgba(22,19,15,.15);font-family:'Newsreader',serif;font-size:.94rem;line-height:1.45;padding:14px 16px}
/* Tip: a border-triangle. An outer ink triangle with a slightly offset paper one on top gives the
   same 2px outline as the popup box. */
.maplibregl-popup-tip{position:relative;border:9px solid transparent}
.maplibregl-popup-tip::after{content:'';position:absolute;border:9px solid transparent}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-bottom:none;border-top-color:var(--ink)}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip::after{left:-9px;top:-11.5px;border-bottom:none;border-top-color:var(--paper)}
.maplibregl-popup-anchor-top .maplibregl-popup-tip{border-top:none;border-bottom-color:var(--ink)}
.maplibregl-popup-anchor-top .maplibregl-popup-tip::after{left:-9px;top:2.5px;border-top:none;border-bottom-color:var(--paper)}
.maplibregl-popup-anchor-left .maplibregl-popup-tip{border-left:none;border-right-color:var(--ink)}
.maplibregl-popup-anchor-left .maplibregl-popup-tip::after{left:2.5px;top:-9px;border-left:none;border-right-color:var(--paper)}
.maplibregl-popup-anchor-right .maplibregl-popup-tip{border-right:none;border-left-color:var(--ink)}
.maplibregl-popup-anchor-right .maplibregl-popup-tip::after{left:-11.5px;top:-9px;border-right:none;border-left-color:var(--paper)}
.maplibregl-popup-anchor-top-left .maplibregl-popup-tip{border-top:none;border-left:none;border-bottom-color:var(--ink)}
.maplibregl-popup-anchor-top-left .maplibregl-popup-tip::after{left:0px;top:2.5px;border-top:none;border-left:none;border-bottom-color:var(--paper)}
.maplibregl-popup-anchor-top-right .maplibregl-popup-tip{border-top:none;border-right:none;border-bottom-color:var(--ink)}
.maplibregl-popup-anchor-top-right .maplibregl-popup-tip::after{left:-9px;top:2.5px;border-top:none;border-right:none;border-bottom-color:var(--paper)}
.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip{border-bottom:none;border-left:none;border-top-color:var(--ink)}
.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip::after{left:0px;top:-11.5px;border-bottom:none;border-left:none;border-top-color:var(--paper)}
.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip{border-bottom:none;border-right:none;border-top-color:var(--ink)}
.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip::after{left:-9px;top:-11.5px;border-bottom:none;border-right:none;border-top-color:var(--paper)}
.maplibregl-popup-close-button{width:24px;height:24px;padding:0;border:none;background:none;font-size:16px;line-height:1;color:#757575;cursor:pointer}
.maplibregl-popup-close-button:hover{background:none;color:var(--ink)}
.maplibregl-popup-content b{display:block;font-family:'Staatliches',sans-serif;font-weight:400;font-size:1.1rem;text-transform:uppercase;letter-spacing:.02em;margin-bottom:.35rem}
.maplibregl-popup-content em{color:var(--muted)}
.maplibregl-popup-content .open{display:block;margin-top:.55rem;color:var(--coral);font-style:normal;font-weight:600;text-decoration:none}
.maplibregl-popup-content .open:hover{text-decoration:underline}
footer{padding:0 0 2.4rem;color:var(--muted);font-size:.88rem;font-style:italic}
footer a{color:var(--muted)}
@media (max-width:600px){#map{height:48vh;box-shadow:none}}
</style>

<script>
(function () {
  var guides = JSON.parse(document.getElementById('guides-data').textContent);

  var map = new maplibregl.Map({
    container: 'map', style: 'https://tiles.openfreemap.org/styles/bright',
    center: [0, 20], zoom: 1, attributionControl: { compact: false }
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');

  var ROUTE       = { color: '#d9451f', width: 2.5, opacity: 0.85, dash: null };
  var ROUTE_MUTED = { color: '#d9451f', width: 1.5, opacity: 0.85, dash: [5, 6] };
  var DOT_FILL = '#d9451f', DOT_STROKE = '#faf6ee';

  // focusAfterOpen:false — the popup opens on card hover, so it must not steal keyboard focus.
  var popup = new maplibregl.Popup({ closeButton: true, offset: 10, maxWidth: '319px', focusAfterOpen: false });

  function popupEl(g) {
    var el = document.createElement('div');
    var b = document.createElement('b'); b.textContent = g.title;
    var em = document.createElement('em'); em.textContent = '\u201C' + g.prompt + '\u201D';
    var a = document.createElement('a');
    a.className = 'open'; a.href = 'samples/' + g.file; a.textContent = 'Open guide \u2192';
    el.appendChild(b); el.appendChild(em); el.appendChild(a);
    return el;
  }
  function openPopup(g) {
    popup.setLngLat(g.marker).setDOMContent(popupEl(g)).addTo(map);
  }

  map.on('load', function () {
    var routeFeatures = [];
    guides.forEach(function (g, i) {
      if (!(g.route && g.route.length > 1)) return;
      routeFeatures.push({
        type: 'Feature', properties: { idx: i, muted: !!g.muted },
        geometry: { type: 'LineString', coordinates: g.route }
      });
    });
    map.addSource('routes', { type: 'geojson', data: { type: 'FeatureCollection', features: routeFeatures } });
    // Main and muted routes are separate layers so each can carry its own dash and colour.
    // Both are added before the dot layer, so every dot renders above every route.
    map.addLayer({ id: 'routes-muted', type: 'line', source: 'routes', filter: ['==', ['get', 'muted'], true],
      layout: { 'line-cap': 'round' },
      paint: { 'line-color': ROUTE_MUTED.color, 'line-width': ROUTE_MUTED.width,
               'line-opacity': ROUTE_MUTED.opacity, 'line-dasharray': ROUTE_MUTED.dash } });
    map.addLayer({ id: 'routes-main', type: 'line', source: 'routes', filter: ['==', ['get', 'muted'], false],
      layout: { 'line-cap': 'round' },
      paint: { 'line-color': ROUTE.color, 'line-width': ROUTE.width, 'line-opacity': ROUTE.opacity } });

    map.addSource('dots', { type: 'geojson', data: { type: 'FeatureCollection',
      features: guides.map(function (g, i) {
        return { type: 'Feature', properties: { idx: i },
                 geometry: { type: 'Point', coordinates: g.marker } };
      }) } });
    map.addLayer({ id: 'dots', type: 'circle', source: 'dots',
      paint: { 'circle-radius': 7, 'circle-color': DOT_FILL,
               'circle-stroke-color': DOT_STROKE, 'circle-stroke-width': 2 } });

    ['dots', 'routes-main', 'routes-muted'].forEach(function (id) {
      map.on('click', id, function (e) { openPopup(guides[e.features[0].properties.idx]); });
      map.on('mouseenter', id, function () { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', id, function () { map.getCanvas().style.cursor = ''; });
    });

    var bb = new maplibregl.LngLatBounds();
    guides.forEach(function (g) { bb.extend(g.marker); });
    map.fitBounds(bb, { padding: 48, animate: false });
  });

  // Postcard grid, from the same data
  var grid = document.getElementById('grid');
  guides.forEach(function (g, idx) {
    var card = document.createElement('a');
    card.className = 'card';
    card.href = 'samples/' + g.file;
    var stamp = document.createElement('span');
    stamp.className = 'stamp';
    stamp.textContent = String(idx + 1).padStart(2, '0');
    var h = document.createElement('h2'); h.textContent = g.title;
    var p = document.createElement('p'); p.className = 'prompt'; p.textContent = g.prompt;
    card.appendChild(stamp); card.appendChild(h); card.appendChild(p);

    var timer;
    function show() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        map.panTo(g.marker, { duration: 700 });
        openPopup(g);
      }, 180);
    }
    card.addEventListener('mouseenter', show);
    card.addEventListener('focus', show);
    card.addEventListener('mouseleave', function () { clearTimeout(timer); });

    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
