<style>
:root{
  --bg:#f2ece1;
  --paper:#faf6ee;
  --ink:#16130f;
  --muted:#7d7364;
  --line:#ddd2bd;
  --coral:#d9451f;
  --gold:#e8a02c;
  --teal:#1d7f8c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Newsreader',serif;line-height:1.5}
.frame{max-width:1120px;margin:0 auto;padding:0 1.25rem}
header{padding:3rem 0 1.4rem}
h1{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:clamp(2.6rem,7vw,4.6rem);line-height:.95;margin:0 0 .7rem;text-transform:uppercase;letter-spacing:.015em}
h1 .accent{color:var(--coral)}
header p.sub{margin:0;font-size:1.12rem;color:var(--muted)}
header p.sub .hand{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--teal);white-space:nowrap}
.map-wrap{padding:1.4rem 0 0}
#map{height:62vh;min-height:400px;border:2px solid var(--ink);border-radius:2px;box-shadow:6px 6px 0 rgba(22,19,15,.12);z-index:0}
main{padding:2rem 0 3.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.5rem 1.25rem}
.card{position:relative;display:block;background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:1.15rem 3.4rem 1.25rem 1.2rem;text-decoration:none;color:inherit;
  box-shadow:0 2px 6px rgba(22,19,15,.08);transition:transform .18s,box-shadow .18s;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 6px,rgba(217,69,31,.05) 6px,rgba(217,69,31,.05) 7px)}
.grid .card:nth-child(3n+1){transform:rotate(-.7deg)}
.grid .card:nth-child(3n+2){transform:rotate(.5deg)}
.grid .card:nth-child(3n){transform:rotate(-.3deg)}
.card:hover,.card:focus-visible{transform:rotate(0) translateY(-4px);box-shadow:0 12px 26px rgba(22,19,15,.16);outline:none;z-index:2}
.card .stamp{position:absolute;top:.7rem;right:.7rem;width:2.15rem;height:2.6rem;border:2px dashed var(--coral);border-radius:2px;display:flex;align-items:center;justify-content:center;
  font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:.8rem;color:var(--coral);transform:rotate(4deg);background:rgba(217,69,31,.05)}
.card h2{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:1.35rem;line-height:1.12;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.02em}
.card p.prompt{margin:0;font-style:italic;color:var(--muted);font-size:.98rem}
.card p.prompt::before{content:"“"}
.card p.prompt::after{content:"”"}
.leaflet-popup-content-wrapper{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:2px;box-shadow:4px 4px 0 rgba(22,19,15,.15)}
.leaflet-popup-tip-container{margin-top:-2px}
.leaflet-popup-tip{background:var(--paper);border:none;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.leaflet-popup-content{font-family:'Newsreader',serif;font-size:.94rem;line-height:1.45;margin:14px 16px}
.leaflet-popup-content b{display:block;font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:1.1rem;text-transform:uppercase;letter-spacing:.02em;margin-bottom:.35rem}
.leaflet-popup-content em{color:var(--muted)}
.leaflet-popup-content .open{display:block;margin-top:.55rem;color:var(--coral);font-style:normal;font-weight:600;text-decoration:none}
.leaflet-popup-content .open:hover{text-decoration:underline}
footer{padding:0 0 2.4rem;color:var(--muted);font-size:.88rem;font-style:italic}
footer a{color:var(--muted)}
@media (max-width:600px){#map{height:48vh;box-shadow:none}}
</style>

<script>
(function () {
  var guides = JSON.parse(document.getElementById('guides-data').textContent);

  var map = L.map('map', { worldCopyJump: true });
  // Routes get their own pane below the default overlay pane (z-index 400),
  // so every dot renders on top of every route line regardless of add order.
  map.createPane('routes');
  map.getPane('routes').style.zIndex = 390;
  map.fitBounds(L.latLngBounds(guides.map(function (g) { return g.marker; })).pad(0.06));
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
    maxZoom: 18
  }).addTo(map);

  var ROUTE = { pane: 'routes', color: '#d9451f', weight: 2.5, opacity: 0.85 };
  var ROUTE_MUTED = { pane: 'routes', color: '#b3a68d', weight: 1.5, opacity: 0.5, dashArray: '5 6' };
  var DOT = { radius: 7, color: '#faf6ee', weight: 2, fillColor: '#d9451f', fillOpacity: 1 };

  function popupHtml(g) {
    var el = document.createElement('div');
    var b = document.createElement('b'); b.textContent = g.title;
    var em = document.createElement('em'); em.textContent = '\u201C' + g.prompt + '\u201D';
    var a = document.createElement('a');
    a.className = 'open'; a.href = 'samples/' + g.file; a.textContent = 'Open guide \u2192';
    el.appendChild(b); el.appendChild(em); el.appendChild(a);
    return el;
  }

  // Split a route at the antimeridian. Each crossing segment is drawn twice —
  // running off one edge of the map and re-entering from the other — so the
  // line stays continuous from dateline to dateline.
  function datelineSegments(route) {
    var pts = route.map(function (p) {
      var lon = ((p[1] + 180) % 360 + 360) % 360 - 180;
      return [p[0], lon];
    });
    var segs = [], cur = [pts[0]];
    for (var i = 1; i < pts.length; i++) {
      var a = cur[cur.length - 1], b = pts[i];
      if (Math.abs(b[1] - a[1]) > 180) {
        var shift = b[1] > a[1] ? -360 : 360;
        cur.push([b[0], b[1] + shift]);   // run off this edge
        segs.push(cur);
        cur = [[a[0], a[1] - shift], b];  // re-enter from the opposite edge
      } else {
        cur.push(b);
      }
    }
    segs.push(cur);
    return segs;
  }

  guides.forEach(function (g) {
    if (g.route && g.route.length > 1) {
      datelineSegments(g.route).forEach(function (seg) {
        L.polyline(seg, g.muted ? ROUTE_MUTED : ROUTE).addTo(map)
          .on('click', function () { g._marker.openPopup(); });
      });
    }
    g._marker = L.circleMarker(g.marker, DOT).addTo(map)
      .bindPopup(popupHtml(g), { maxWidth: 280 });
  });

  // Postcard grid, from the same data
  var grid = document.getElementById('grid');
  guides.forEach(function (g, idx) {
    var card = document.createElement('a');
    card.className = 'card';
    card.href = 'samples/' + g.file;
    var stamp = document.createElement('span');
    stamp.className = 'stamp';
    stamp.textContent = String(idx + 1).padStart(2, '0');
    var h = document.createElement('h2'); h.textContent = g.title;
    var p = document.createElement('p'); p.className = 'prompt'; p.textContent = g.prompt;
    card.appendChild(stamp); card.appendChild(h); card.appendChild(p);

    var timer;
    function show() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        map.panTo(g.marker, { duration: 0.7 });
        g._marker.openPopup();
      }, 180);
    }
    card.addEventListener('mouseenter', show);
    card.addEventListener('focus', show);
    card.addEventListener('mouseleave', function () { clearTimeout(timer); });

    grid.appendChild(card);
  });
})();
</script>
